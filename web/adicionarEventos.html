<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adicionar Evento Esportivo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{background: linear-gradient(
            rgba(0, 0, 0, 0.9),
            rgba(0, 0, 0, 0.9)
        );
    background-image: url('https://cdn.pixabay.com/photo/2017/10/29/22/32/volleyball-fans-2900981_1280.jpg');
    background-size: 100% 100%;
    background-position: center;
    min-height:100vh;
    color:white;
    background-color: #081d4fbb;
}

.container{
    max-width:900px;
    margin:auto;
}

.topo{
    text-align:center;
    margin-top:20px;
    margin-bottom:35px;
}

.topo h1{
    font-size:42px;
    font-weight:700;
    margin-bottom:10px;
}

.linha {
    width: 100%;
    margin: 3px auto 20px;
    border-bottom: 1px solid #ddd;
}

.topo p{
    color:#94a3b8;
    font-size:16px;
}

.card{
    width: 1000px;
    padding: 25px;
    background:#111827f3;
    border:1px solid #1e293b;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.card-header{
    padding:30px;
    border-bottom:1px solid #1f2937;
}

.card-header h2{
    margin-bottom:8px;
}

.card-header p{
    color:#94a3b8;
}

.form{
    padding:30px;
}

.form-group{
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:10px;
    font-weight:600;
}

.modalidades-grid,
.acessibilidade-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:15px;
}

.modalidades-grid input,
.acessibilidade-grid input{
    display:none;
}

.modalidade-card,
.acessibilidade-card{
    background:#1e293b;
    border:2px solid #334155;
    border-radius:18px;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#cbd5e1;
    font-size:15px;
    font-weight:500;

    cursor:pointer;
    user-select:none;
    transition:.15s;
}

.modalidade-card:hover,
.acessibilidade-card:hover{
    border-color:#3b82f6;
    transform:translateY(-2px);
}

.modalidades-grid input:checked + .modalidade-card,
.acessibilidade-grid input:checked + .acessibilidade-card{
    background:#2563eb;
    border-color:#60a5fa;
    color:white;

    box-shadow:
        0 0 0 3px rgba(96,165,250,.4),
        0 0 20px rgba(37,99,235,.6);

    font-weight:600;
}

input[type="text"],
textarea,
select{
    width:100%;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:14px;
    padding:15px;
    color:white;
    transition:0.3s;
}

input[type="text"]::placeholder,
textarea::placeholder{
    color:#64748b;
}

input[type="text"]:focus,
textarea:focus,
select:focus{
    outline:none;
    border-color:#3b82f6;
    box-shadow:0 0 0 4px rgba(59,130,246,.15);
}

.item{
    background:#1e293b;
    border:1px solid #334155;
    padding:12px;
    border-radius:12px;
    display:flex;
    align-items:center;
    gap:10px;
}

.item input{
    width:18px;
    height:18px;
}

.upload{
    border:2px dashed #334155;
    border-radius:16px;
    padding:35px;
    text-align:center;
    background:#1e293b;
    cursor:pointer;
    transition:0.3s;
}

.upload:hover{
    border-color:#3b82f6;
}

.upload p{
    color:#94a3b8;
    margin-top:8px;
}

.upload input{
    display:none;
}

.mensagem-upload{
    margin-top:12px;
    padding:12px;
    border-radius:12px;
    background:#14532d;
    border:1px solid #22c55e;
    color:#dcfce7;
    display:none;
    font-size:14px;
    font-weight:500;
}


#miniaturas-imagens {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-top: 12px;
}

.miniatura-container {
    width: 100px;
    height: 100px;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #ccc;
    background-color: #f2f2f2;
}

.miniatura-imagem {
    width: 100%;
    height: 100%;
    object-fit: cover;
}


.btn{
    width:100%;
    margin-top:10px;
    border:none;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
    padding:16px;
    font-size:16px;
    font-weight:600;
    border-radius:14px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(37,99,235,.3);
}

.mensagem-sucesso{
    display:none;
    position:sticky;
    top:20px;

    background:#14532d;
    border:1px solid #22c55e;
    color:#dcfce7;

    padding:15px;
    border-radius:12px;
    margin-bottom:20px;

    text-align:center;
    font-weight:600;
}

.linha-dupla{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:15px;
}

@media(max-width:768px){
    .linha-dupla{
        grid-template-columns:1fr;
    }
}

input[type="date"],
input[type="time"]{
    width:100%;

    background:#1e293b;
    border:1px solid #334155;

    color:white;

    padding:14px;
    border-radius:12px;

    margin-bottom:20px;

    transition:.2s;
}

input[type="date"]:focus,
input[type="time"]:focus{
    outline:none;
    border-color:#3b82f6;
    box-shadow:0 0 0 3px rgba(59,130,246,.15);
}

</style>
</head>
<body>

<div class="container">

    <div id="mensagem-sucesso" class="mensagem-sucesso"></div>
     <div class="topo">
        <h1>Adicionar evento esportivo</h1>
            <div class="linha"></div>
    </div>
   
    <div class="card">

        <div class="card-header">
            <h1>Adicionar evento esportivo</h1>
            <p>Preencha os dados abaixo. Todos os campos são obrigatórios.</p>
        </div>

        <form class="form-evento" id="form-evento">

            <div class="form-group">
                <label for="nome">Nome do evento</label>
                <input
                    type="text"
                    id="nome"
                    placeholder="Ex: Campeonato Regional de Futebol">
            </div>

            <div class="form-group">
                <label for="endereco">Endereço completo</label>
                <input
                    type="text"
                    id="endereco"
                    placeholder="Ex: Rua das Flores, 123 - Centro">
            </div>

                <div>
                    <label for="dataInicio">Data de início do evento</label>
                    <input type="date" id="dataInicio">
                </div>

                <div>
                    <label for="dataFim">Data de fim do evento</label>
                    <input type="date" id="dataFim">
                </div>

                <div>
                    <label for="horarioInicio">Horário de início do evento</label>
                    <input type="time" id="horarioInicio">
                </div>

                <div>
                    <label for="horarioFim">Horário de fim do evento</label>
                    <input type="time" id="horarioFim">
                </div>

            <div class="form-group">

                <label>Modalidade(s) do evento</label>

                <div class="modalidades-grid">

                    <input type="checkbox" id="Vôlei" name="modalidades[]" value="Vôlei">
          <label for="Vôlei" class="modalidade-card">
            Vôlei
          </label>

          <input type="checkbox" id="Vôlei de praia" name="modalidades[]" value="Vôlei de praia">
          <label for="Vôlei de praia" class="modalidade-card">
            Vôlei de praia
          </label>

          <input type="checkbox" id="Basquete" name="modalidades[]" value="Basquete">
          <label for="Basquete" class="modalidade-card">
            Basquete
          </label>

          <input type="checkbox" id="Handebol" name="modalidades[]" value="Handebol">
          <label for="Handebol" class="modalidade-card">
            Handebol
          </label>

          <input type="checkbox" id="Futsal" name="modalidades[]" value="Futsal">
          <label for="Futsal" class="modalidade-card">
            Futsal
          </label>

          <input type="checkbox" id="Tênis de mesa" name="modalidades[]" value="Tênis de mesa">
          <label for="Tênis de mesa" class="modalidade-card">
            Tênis de mesa
          </label>  

          <input type="checkbox" id="Natação" name="modalidades[]" value="Natação">
          <label for="Natação" class="modalidade-card">
              Natação
          </label>

          <input type="checkbox" id="Artes marciais" name="modalidades[]" value="Artes marciais">
          <label for="Artes marciais" class="modalidade-card">
               Artes marciais
          </label>

          <input type="checkbox" id="Futebol de campo" name="modalidades[]" value="Futebol de campo">
          <label for="Futebol de campo" class="modalidade-card">
                Futebol de campo
          </label>

          <input type="checkbox" id="Skateboarding" name="modalidades[]" value="Skateboarding"      >
          <label for="Skateboarding" class="modalidade-card">
                   Skateboarding
          </label>
          <input type="checkbox" id="Futebol de areia" name="modalidades[]" value="Futebol de areia">
          <label for="Futebol de areia" class="modalidade-card">
                   Futebol de areia
          </label>
          <input type="checkbox" id="Beach tennis" name="modalidades[]" value="Beach tennis">
          <label for="Beach tennis" class="modalidade-card">
                   Beach tennis
          </label>
          <input type="checkbox" id="Futevôlei" name="modalidades[]" value="Futevôlei">
          <label for="Futevôlei" class="modalidade-card">
                   Futevôlei
          </label>
          <input type="checkbox" id="Futebol de mesa" name="modalidades[]" value="Futebol de mesa">
          <label for="Futebol de mesa" class="modalidade-card">
                   Futebol de mesa
          </label>
          <input type="checkbox" id="Corrida de rua" name="modalidades[]" value="Corrida de rua">
          <label for="Corrida de rua" class="modalidade-card">
                   Corrida de rua
          </label>

                </div>

            </div>

            <div class="form-group">

                <label for="descricao">Descrição</label>

                <textarea
                    id="descricao"
                    placeholder="Descreva brevemente o evento esportivo..."></textarea>

            </div>

            <div class="form-group">

                <label class="upload">

                    📷

                    <h3>Selecionar imagens do evento esportivo</h3>

                    <p>Arraste arquivos ou clique para enviar.</p>

                    <input type="file" id="imagens" accept="image/*"multiple/>

                    <p id="mensagem-imagem" style="display: none;"></p>

                    <div id="miniaturas-imagens"></div>

                </label>

            </div>

            <button class="btn" type="submit">
                Cadastrar Evento
            </button>

</div>
<body>

<script type="module" src="adicionarEventos.js"></script>

</body>
</html>
