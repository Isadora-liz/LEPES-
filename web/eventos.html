<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Eventos</title>

<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
     font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f5f5f5;
    padding-bottom: 80px;


    background:
        linear-gradient(
            rgba(0, 0, 0, 0.5),
            rgba(0, 0, 0, 0.5)
        ),
        url('https://img.olympics.com/images/image/private/t_social_share_thumb/f_auto/primary/auafcdczaz9xfuv5qxuo');


    background-size: cover;
}

.header {
    padding: 16px 100px;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}


.busca-container {
    display: flex;
    align-items: center;
    background-color: #f0f0f0;
    border-radius: 12px;
    padding: 12px 16px;
    gap: 10px;
}


.search-icon {
    color: #666;
    font-size: 18px;
}


.search-input {
    border: none;
    background: transparent;
    flex: 1;
    font-size: 16px;
    outline: none;
    color: #333;
}


.search-input::placeholder {
    color: #999;
}


.titulo {
    width: 100%;
    margin: 25px auto 0;
    font-size: 32px;
    color: white;
}


.linha {
    width: 100%;
    margin: 3px auto 20px;
    border-bottom: 1px solid #ddd;
}




.bot-modalidades-container {
    display: flex;
    padding: 0 20px;
    white-space: nowrap;
    align-items: center;
    gap: 10px;
    justify-content: transform;
}


#filtros-modalidades {
    padding: 16px 0;
    overflow-x: auto;
    scrollbar-width: none;
}




.bot-modalidade::-webkit-scrollbar {
    display: none;
}


.bot-modalidade {
    padding: 10px 20px;
    border: 1px solid #ddd;
    background-color: #fff;
    border-radius: 20px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 500;
    color: #666;
    transition: all 0.3s ease;
    white-space: nowrap;
}


.bot-modalidade:hover {
    background-color: #f5f5f5;
}


.bot-modalidade.ativo {
    background: #0055ff;
    color: white;
    border-color: #0033aa;
}


#seta-esq,
#seta-dir {
    border-radius: 50%;
    width: 35px;
    height: 35px;
    display: flex;
    justify-content: center;
    align-items: center;
    border: none;
    background-color: white;
    cursor: pointer;
}


.explore-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 20px;
}

.container{
    max-width:1100px;
    margin:30px auto;
    padding:0 20px;
}

.busca{
    width:100%;
    padding:14px;
    border:none;
    border-radius:12px;
    margin-bottom:25px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.lista-eventos{
    display:flex;
    flex-direction:column;
    gap:20px;
}

.evento{
    position:relative;
    background:#0f172a;
    border:1px solid #334155;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
    transition:.2s;
}

.evento:hover{
    transform:translateY(-3px);
}

.imagem-evento{
    position: relative;
    width: 280px;
    flex-shrink: 0;
}

.imagem-evento img{
    width:100%;
    height:200px;
    object-fit:cover;
    display:block;
}

.botao-editar{
    position:absolute;
    top:12px;
    right:70px;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
}


.botao-editar:hover {
    transform: scale(1.1);
}


.botao-editar .material-icons {
    color: #333;
    font-size: 22px;
}

.botao-remover{
    position:absolute;
    top:12px;
    right:12px;
    width: 40px;
    height: 40px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.95);
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: 0.2s;
}


.botao-remover:hover {
    transform: scale(1.1);
}


.botao-remover .material-icons {
    color: #552727;
    font-size: 22px;
}

.info{
    padding:20px;
    flex:1;
}

.modalidade{
    display:inline-block;
    background:#e0ecff;
    color:#2563eb;
    padding:6px 12px;
    border-radius:20px;
    font-size:13px;
    margin-bottom:10px;
}

.info h2{
    margin-bottom:10px;
    color:white;
}

.detalhes{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    margin-bottom:12px;
    color:white;
}

.detalhes span{
    display:flex;
    align-items:center;
    gap:5px;
}

.endereco span{
    display:flex;
    align-items:center;
    gap:5px;
    margin-bottom:12px;
    color:white;
}

.descricao{
    color:white;
    line-height:1.5;
}

.botao-evento{
    display:inline-block;
    margin-top:15px;
    padding:10px 18px;
    background:#2563eb;
    color:white;
    text-decoration:none;
    border-radius:10px;
}

.botao-evento:hover{
    background:#1d4ed8;
}

#botaoAdicionar{
    position:fixed;

    bottom:25px;
    right:25px;

    border:none;
    border-radius:30px;

    background:#2563eb;
    color:white;

    padding:15px 25px;

    cursor:pointer;

    box-shadow:0 4px 12px rgba(0,0,0,.25);

    font-size:15px;
    font-weight:600;

    transition:.2s;
}

#botaoAdicionar:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}


.botao-menu {
    bottom: 0;
    left: 0;
    width: 100%;
    background: #111;
    color: white;
    display: flex;
    padding: 15px 0;
    font-size: 18px;
    height: 45px;
}


.botao-menu a {
    color: white;
    text-decoration: none;
    transition: 0.2s;
}


.botao-menu a:hover {
    color: #1877f2 !important;
}


.botao-menu a.active {
    color: #1877f2 !important;
}



#icone-mapa {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 14px;
    padding: 0 40px;
}


#icone-mapa::before {
    /*content: 'map'; */
    font-family: 'Material Icons';
    font-size: 25px;
    margin-bottom: 4px;
}


#icone-explorar {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-decoration: none;
  color: #ffffff;
  font-family: Arial, sans-serif;
  font-size: 14px;
  padding: 0 10px;
  margin-left: 73%;
  position: transform;
}


#icone-explorar::before {
  /*content: 'explore'; */
  font-family: 'Material Icons';
  font-size: 25px;
  margin-bottom: 4px;
}


#icone-usuario {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 14px;
    padding: 0 10px;
}


#icone-usuario::before {
  /*content: 'person'; */
  font-family: 'Material Icons';
  font-size: 25px;
  margin-bottom: 4px;
}

#icone-eventos {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-decoration: none;
    color: #ffffff;
    font-family: Arial, sans-serif;
    font-size: 14px;
    padding: 0 10px;
}


#icone-eventos::before {
  /*content: 'event'; */
  font-family: 'Material Icons';
  font-size: 25px;
  margin-bottom: 4px;
}

</style>
</head>

<body>

<div class="botao-menu">
    <p style="margin-left: 20px; margin-top: 0px; font-weight: 600; ">LEPES</p>
    <a href="explorar.html" class="active" id="icone-explorar">Explorar</a>
    <a href="eventos.html" class="" id="icone-eventos">Eventos</a>
</div>


<header class="header">
       <div class="titulo">Eventos Esportivos</div>
            <div class="linha"></div>
        <div class="busca-container">
        <input
            id="busca-container"
            type="text"
            class="search-input"
            placeholder="Buscar eventos..."
        >
        </div>
    <div class="bot-modalidades-container">
        <button id="seta-esq">◀</button>
        <div id="filtros-modalidades">
            <button class="bot-modalidade" data-id="1">Vôlei</button>
            <button class="bot-modalidade" data-id="2">Futebol</button>
            <button class="bot-modalidade" data-id="3">Tênis de Mesa</button>
            <button class="bot-modalidade" data-id="4">Basquete</button>
            <button class="bot-modalidade" data-id="5">Skate</button>
            <button class="bot-modalidade" data-id="6">Bocha</button>
            <button class="bot-modalidade" data-id="7">Tênis de Praia</button>
            <button class="bot-modalidade" data-id="8">Futevôlei</button>
            <button class="bot-modalidade" data-id="9">Tênis</button>
            <button class="bot-modalidade" data-id="10">Vôlei de Praia</button>
            <button class="bot-modalidade" data-id="11">Peteca</button>
            <button class="bot-modalidade" data-id="12">Pádel</button>
        </div>
        <button id="seta-dir">▶</button>
    </div>


</header>

<div class="container">
    <div id="sem-eventos">Nenhum evento encontrado.</div>
    <div id="lista-eventos" class="lista-eventos"></div>

</div>



<button
    id="botaoAdicionar"
    onclick="window.location.href='adicionarEventos.html'"
>Adicionar novo evento</button>

<script type="module" src="./eventos.js"></script>

</body>
</html>
