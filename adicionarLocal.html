<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adicionar Local Esportivo</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins', sans-serif;
}

body{background: linear-gradient(
            rgba(0, 0, 0, 0.9),
            rgba(0, 0, 0, 0.9)
        );
    background-image: url('https://ardos.com.br/wp-content/uploads/2020/08/Depositphotos_83082692_xl-2015-2048x1422.jpg.webp');
    background-size: 100% 100%;
    background-position: center;
    min-height:100vh;
    color:white;
}



.container{
    max-width:900px;
    margin:auto;
}

.topo{
    width: 100%;
    margin: 25px auto 0;
    margin-top:20px;
    margin-bottom:35px;
}

.topo h1{
    width: 100%;
    margin: 25px auto 0;
    font-size: 32px;
    color: white;

}

.linha {
    width: 100%;
    margin: 3px auto 20px;
    border-bottom: 1px solid #ddd;
}


.card{
    width: 1000px;
    padding: 25px;
    background:#111827;
    border:1px solid #1e293b;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 15px 40px rgba(0,0,0,.35);
}

.card-header{
    padding:30px;
    border-bottom:1px solid #1f2937;
}

.card-header h2{
    margin-bottom:8px;
}

.card-header p{
    color:#94a3b8;
}

.form{
    padding:30px;
}

.form-group{
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:10px;
    font-weight:600;
}

.modalidades-grid,
.acessibilidade-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
    gap:15px;
}

.modalidades-grid input,
.acessibilidade-grid input{
    display:none;
}

.modalidade-card,
.acessibilidade-card{
    background:#1e293b;
    border:2px solid #334155;
    border-radius:18px;
    height:70px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#cbd5e1;
    font-size:15px;
    font-weight:500;

    cursor:pointer;
    user-select:none;
    transition:.15s;
}

.modalidade-card:hover,
.acessibilidade-card:hover{
    border-color:#3b82f6;
    transform:translateY(-2px);
}

/* CONTRASTE MAIOR AO SELECIONAR */

.modalidades-grid input:checked + .modalidade-card,
.acessibilidade-grid input:checked + .acessibilidade-card{
    background:#2563eb;
    border-color:#60a5fa;
    color:white;

    box-shadow:
        0 0 0 3px rgba(96,165,250,.4),
        0 0 20px rgba(37,99,235,.6);

    font-weight:600;
}

input[type="text"],
textarea,
select{
    width:100%;
    background:#1e293b;
    border:1px solid #334155;
    border-radius:14px;
    padding:15px;
    color:white;
    transition:0.3s;
}

input[type="text"]::placeholder,
textarea::placeholder{
    color:#64748b;
}

input[type="text"]:focus,
textarea:focus,
select:focus{
    outline:none;
    border-color:#3b82f6;
    box-shadow:0 0 0 4px rgba(59,130,246,.15);
}

.acessibilidade{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:12px;
}

.item{
    background:#1e293b;
    border:1px solid #334155;
    padding:12px;
    border-radius:12px;
    display:flex;
    align-items:center;
    gap:10px;
}

.item input{
    width:18px;
    height:18px;
}

.upload{
    border:2px dashed #334155;
    border-radius:16px;
    padding:35px;
    text-align:center;
    background:#1e293b;
    cursor:pointer;
    transition:0.3s;
}

.upload:hover{
    border-color:#3b82f6;
}

.upload p{
    color:#94a3b8;
    margin-top:8px;
}

.upload input{
    display:none;
}

.mensagem-upload{
    margin-top:12px;
    padding:12px;
    border-radius:12px;
    background:#14532d;
    border:1px solid #22c55e;
    color:#dcfce7;
    display:none;
    font-size:14px;
    font-weight:500;
}

.btn{
    width:100%;
    margin-top:10px;
    border:none;
    background:linear-gradient(135deg,#2563eb,#3b82f6);
    color:white;
    padding:16px;
    font-size:16px;
    font-weight:600;
    border-radius:14px;
    cursor:pointer;
    transition:0.3s;
}

.btn:hover{
    transform:translateY(-2px);
    box-shadow:0 10px 25px rgba(37,99,235,.3);
}

.mensagem-sucesso{
    display:none;
    position:sticky;
    top:20px;

    background:#14532d;
    border:1px solid #22c55e;
    color:#dcfce7;

    padding:15px;
    border-radius:12px;
    margin-bottom:20px;

    text-align:center;
    font-weight:600;
}

</style>
</head>
<body>


<div class="container">
 

<div id="mensagem-sucesso" class="mensagem-sucesso">

</div>
    <div class="topo">
        <h1>Adicionar espaço esportivo</h1>
            <div class="linha"></div>
    </div>

    <div class="card">

        <div class="card-header">
            <h2>Informações do Local</h2>
            <p>Preencha os dados abaixo, todos os campos são obrigatórios.</p>
        </div>

        <form id="form-local" class="form-local">

            <div class="form-group">
                <label>Nome do local</label>
                <input id="nome" type="text" placeholder="Ex: Ginásio Poliesportivo Municipal">
            </div>

            <div class="form-group">
                <label>Endereço completo</label>
                <input id="endereco" type="text" placeholder="Ex: Rua das Flores, 123 - Centro">
            </div>

            <div class="form-group">
                <label>Descrição</label>
                <textarea id="descricao" placeholder="Descreva as características do local esportivo..."></textarea>
            </div>

            <div class="form-group">
<div class="form-group">
    <label>Modalidades disponíveis</label>
    <div class="modalidades-grid">

          <input type="checkbox" id="voleibol" name="modalidades[]" value="Voleibol">
          <label for="voleibol" class="modalidade-card">
            Voleibol
          </label>

          <input type="checkbox" id="volei" name="modalidades[]" value="Vôlei_praia">
          <label for="volei" class="modalidade-card">
            Vôlei de praia
          </label>

          <input type="checkbox" id="basquete" name="modalidades[]" value="Basquete">
          <label for="basquete" class="modalidade-card">
            Basquete
          </label>

          <input type="checkbox" id="handebol" name="modalidades[]" value="Handebol">
          <label for="handebol" class="modalidade-card">
            Handebol
          </label>

          <input type="checkbox" id="futsal" name="modalidades[]" value="Futsal">
          <label for="futsal" class="modalidade-card">
            Futsal
          </label>

          <input type="checkbox" id="Tênis de mesa" name="modalidades[]" value="Tênis_mesa">
          <label for="Tênis de mesa" class="modalidade-card">
            Tênis de mesa
          </label>  

          <input type="checkbox" id="natação" name="modalidades[]" value="Natação">
          <label for="natação" class="modalidade-card">
              Natação
          </label>

          <input type="checkbox" id="artes marciais" name="modalidades[]" value="Artes_Marciais">
          <label for="artes marciais" class="modalidade-card">
               Artes Marciais
          </label>

          <input type="checkbox" id="futebol de campo" name="modalidades[]" value="Futebol_Campo">
          <label for="futebol de campo" class="modalidade-card">
                Futebol de Campo
          </label>

          <input type="checkbox" id="skateboarding" name="modalidades[]" value="Skateboarding"      >
          <label for="skateboarding" class="modalidade-card">
                   Skateboarding
          </label>
          <input type="checkbox" id="futebol de areia" name="modalidades[]" value="Futebol_Areia">
          <label for="futebol de areia" class="modalidade-card">
                   Futebol de Areia
          </label>
          <input type="checkbox" id="beach tennis" name="modalidades[]" value="Beach_Tennis">
          <label for="beach tennis" class="modalidade-card">
                   Beach Tennis
          </label>
          <input type="checkbox" id="futevôlei" name="modalidades[]" value="Futevôlei">
          <label for="futevôlei" class="modalidade-card">
                   Futevôlei
          </label>
          <input type="checkbox" id="futemesa" name="modalidades[]" value="Futebol_Mesa">
          <label for="futemesa" class="modalidade-card">
                   Futebol de Mesa
          </label>
</div>
    <label>Acessibilidade
    </label>

        <div class="acessibilidade-grid">

            <input type="checkbox" id="rampa" name="acessibilidade[]" value="Rampa_Acesso">
            <label for="rampa" class="acessibilidade-card">
                Rampa de Acesso
            </label>

            <input type="checkbox" id="banheiro" name="acessibilidade[]" value="Banheiro_Adaptado">
            <label for="banheiro" class="acessibilidade-card">
                Banheiro Adaptado
            </label>

            <input type="checkbox" id="Suporte" name="acessibilidade[]" value="Suporte_Cadeirante">
            <label for="Suporte" class="acessibilidade-card">
                Suporte para Cadeirante
            </label>

            <input type="checkbox" id="vagas" name="acessibilidade[]" value="Vagas_Reservadas">
            <label for="vagas" class="acessibilidade-card">
                Vagas Reservadas
            </label>
            <input type="checkbox" id="piso" name="acessibilidade[]" value="Piso_Tátil">
            <label for="piso" class="acessibilidade-card">
                Piso Tátil
            </label>
              </div>

           <label class="upload">
         📷
         <h3>Selecionar Imagens do espaço esportivo</h3>
         <p>Arraste arquivos ou clique para enviar</p>

     <input
        type="file"
        id="imagens"
        multiple
        accept="image/*"
    >
</label>
<div id="mensagem-imagem" class="mensagem-sucesso">
</div>

    </div>
    <button class="btn" type="submit">
    Cadastrar Espaço
    </button>
<body>

<script type="module" src="./adicionarLocal.js"></script>
</html>
</body>
